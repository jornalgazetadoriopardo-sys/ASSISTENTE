<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atendimento de Clientes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: uma coluna de cartões por urgência, faixa de contadores no topo, botão fixo de nova peça. Acento magenta de registro CMYK. */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --ink:#15171C; --muted:#5E6472; --line:#DDE0E7;
  --accent:#C41E63; --accent-ink:#FFFFFF; --accent-soft:#FBE7EF;
  --ok:#1E7A4C; --ok-soft:#E3F3EA; --warn:#A35F00; --warn-soft:#FDF0DC;
  --bad:#C0352B; --bad-soft:#FBE6E3; --info:#2C5FB8; --info-soft:#E4ECFA;
  --neutral:#6B7180; --neutral-soft:#ECEEF2;
  --f-display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111318; --surface:#1A1D24; --ink:#ECEEF3; --muted:#9AA1B0; --line:#2C303A;
  --accent:#F0558F; --accent-ink:#1A0610; --accent-soft:#3A1726;
  --ok:#5FCB92; --ok-soft:#163326; --warn:#F2B24C; --warn-soft:#3A2C12;
  --bad:#F07A6F; --bad-soft:#3D1C19; --info:#82A9F0; --info-soft:#1A2740;
  --neutral:#A2A8B5; --neutral-soft:#262A33; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111318; --surface:#1A1D24; --ink:#ECEEF3; --muted:#9AA1B0; --line:#2C303A;
  --accent:#F0558F; --accent-ink:#1A0610; --accent-soft:#3A1726;
  --ok:#5FCB92; --ok-soft:#163326; --warn:#F2B24C; --warn-soft:#3A2C12;
  --bad:#F07A6F; --bad-soft:#3D1C19; --info:#82A9F0; --info-soft:#1A2740;
  --neutral:#A2A8B5; --neutral-soft:#262A33; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 110px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:700;font-size:1.75rem;line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
.date{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sub{color:var(--muted);margin:4px 0 0;font-size:.9rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 10px 9px;text-align:left;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-display);font-size:1.6rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted);line-height:1.2}
.stat.bad b{color:var(--bad)} .stat.warn b{color:var(--warn)} .stat.info b{color:var(--info)} .stat.ok b{color:var(--ok)}
.stat[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
@media (max-width:440px){.stats{grid-template-columns:repeat(2,1fr)}}
.chips{display:flex;gap:6px;overflow-x:auto;margin:14px -4px 0;padding:2px 4px 4px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:.85rem;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:18px 0 8px;flex-wrap:wrap}
.bar h2{font-family:var(--f-display);font-size:1.05rem;margin:0;font-weight:600}
.toggle{font-size:.85rem;color:var(--muted);display:flex;gap:6px;align-items:center;cursor:pointer}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.is-late{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px 3px 6px;font-size:.78rem;font-weight:600}
.pill svg{width:15px;height:15px;flex:none}
.s-briefing{background:var(--neutral-soft);color:var(--neutral)}
.s-producao{background:var(--info-soft);color:var(--info)}
.s-aguardando{background:var(--warn-soft);color:var(--warn)}
.s-ajustes{background:var(--bad-soft);color:var(--bad)}
.s-aprovado{background:var(--ok-soft);color:var(--ok)}
.s-publicado{background:var(--neutral-soft);color:var(--ok)}
.flag{font-size:.75rem;font-weight:600;border-radius:6px;padding:2px 7px}
.flag.bad{background:var(--bad);color:var(--surface)}
.flag.warn{background:var(--warn-soft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent)}
.flag.ex{background:var(--accent-soft);color:var(--accent)}
.title{font-weight:600;font-size:1.02rem;margin:0;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.84rem;color:var(--muted)}
.meta .client{color:var(--ink);font-weight:600}
.mono{font-family:var(--f-mono);font-size:.8rem;font-variant-numeric:tabular-nums}
.obs{font-size:.86rem;color:var(--muted);margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{font:inherit;font-size:.85rem;font-weight:600;border-radius:8px;padding:7px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;line-height:1.2}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.more{margin-left:auto;padding:7px 10px;color:var(--muted)}
.btn:focus-visible,.chip:focus-visible,.stat:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:disabled{opacity:.5;cursor:default}
.edit{border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:8px}
label.f{display:grid;gap:4px;font-size:.8rem;color:var(--muted);font-weight:600}
input,select,textarea{font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:60px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:440px){.row2{grid-template-columns:1fr}}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:22px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:1rem;margin-bottom:4px}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent);padding:12px 18px;font-size:.95rem;border-radius:999px}
.sheet-bg{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 40%,transparent);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:10px;max-height:92vh;overflow:auto}
.sheet h3{font-family:var(--f-display);margin:0;font-size:1.2rem}
.clients{display:flex;flex-direction:column;gap:8px}
.crow{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.crow .n{font-weight:600}
.crow .c{font-size:.8rem;color:var(--muted)}
.crow .phone{grid-column:1/-1;display:flex;gap:6px;align-items:center}
.crow .phone input{font-size:.85rem;padding:6px 8px}
.crow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.addc{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:8px}
@media (max-width:440px){.addc{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:.88rem;z-index:30;max-width:calc(100% - 32px)}
.notice{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:.86rem;margin-top:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.copybox{width:100%;font-size:.85rem}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .2s}}
/* Acréscimos da versão independente: login e resumo semanal do agente */
.login{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 16px}
.report{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 18px}
.report h2{margin:0 0 6px}
.report pre{white-space:pre-wrap;font:inherit;margin:8px 0 0;color:var(--ink)}
.report small{color:var(--muted)}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <div class="date" id="today"></div>
      <h1>Atendimento de Clientes</h1>
      <p class="sub">O que está com você, o que está com o cliente e o que já passou do prazo.</p>
    </div>
  </header>

  <div class="login" id="login" hidden></div>
  <section class="report" id="report" hidden></section>

  <div class="stats" id="stats" role="group" aria-label="Resumo"></div>
  <div id="exNotice"></div>
  <div class="chips" id="chips" role="group" aria-label="Filtrar por cliente"></div>

  <div class="bar">
    <h2 id="listTitle">Peças em andamento</h2>
    <label class="toggle"><input type="checkbox" id="showDone" style="width:auto"> Mostrar publicadas</label>
  </div>
  <div class="list" id="list">
    <div class="empty"><b>Carregando suas peças…</b>Em instantes a lista aparece aqui.</div>
  </div>

  <div class="bar" style="margin-top:28px"><h2>Clientes</h2></div>
  <div class="clients" id="clients"></div>
  <form class="addc" id="addClient">
    <input id="newClientName" placeholder="Nome do cliente" required aria-label="Nome do cliente">
    <input id="newClientPhone" placeholder="WhatsApp (opcional)" inputmode="tel" aria-label="WhatsApp do cliente">
    <button class="btn" type="submit">Adicionar cliente</button>
  </form>
</div>

<button class="btn primary fab" id="fab" type="button">+ Nova peça</button>
<div id="sheetHost"></div>
<div class="toast" id="toast" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
